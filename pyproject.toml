[project]
name = "secure-account-fastapi"
version = "0.1.0"
description = "Educational secure account management system built with FastAPI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pwdlib[argon2]>=0.2.1",
  "pyotp>=2.9.0",
  "qrcode[pil]>=8.0",
  "jinja2>=3.1.4",
  "itsdangerous>=2.2.0",
  "python-multipart>=0.0.12",
  "httpx==0.27.0",
  "email-validator>=2.2.0",
]

[project.scripts]
secure-account = "app.main:run"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
