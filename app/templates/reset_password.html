{% extends "base.html" %}{% block title %}New password{% endblock %}
{% block content %}
<h1>New password</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/auth/reset-password-form">
    <input type="hidden" name="token" value="{{ token }}">
    <label>New password <input type="password" name="password" minlength="8" required>
        <button type="button" class="password-toggle">Show</button>
        <small class="password-length"></small></label>
    <button>Change password</button>
</form>
{% endblock %}
